<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<article class="product-card" th:fragment="productCard(product)">
    <a class="product-image" th:href="@{/products(category=${product.category})}">
        <img th:src="${product.imageUrl}" th:alt="${product.name}" loading="lazy">
        <span class="product-badge" th:text="${product.badge}">Featured</span>
    </a>
    <div class="product-info">
        <div class="product-meta"><span th:text="${product.category}">Category</span><span>★ <span th:text="${product.rating}">5.0</span></span></div>
        <h3 th:text="${product.name}">Product name</h3>
        <p class="product-description" th:text="${product.description}">Product details</p>
        <div class="product-buy">
            <div class="price-stack">
                <strong th:text="|$${#numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT')}|">$0.00</strong>
                <del th:text="|$${#numbers.formatDecimal(product.previousPrice, 1, 'COMMA', 2, 'POINT')}|">$0.00</del>
            </div>
            <form th:action="@{/cart/items/{id}(id=${product.id})}" method="post">
                <button class="add-button" type="submit" aria-label="Add product to bag">+</button>
            </form>
        </div>
    </div>
</article>
</body>
</html>
