<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create an account | ThinkMart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/store.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: header('account', ${cartCount})}"></div>
<main class="auth-page">
    <section class="auth-content">
        <p class="eyebrow">A fresh start</p><h1>Make it<br><em>yours.</em></h1>
        <p class="auth-intro">Create your ThinkMart account.</p>
        <p class="flash-message error" th:if="${error}" th:text="${error}"></p>
        <form class="auth-form" th:action="@{/signup}" method="post">
            <label for="name">Your name</label><input id="name" name="name" autocomplete="name" required maxlength="100">
            <label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="160">
            <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="6" maxlength="100">
            <button class="button button-dark" type="submit">Create account <span>↗</span></button>
        </form>
        <p class="auth-switch">Already have an account? <a th:href="@{/login}">Log in</a></p>
    </section>
    <div class="auth-visual signup-visual" role="img" aria-label="A modern laptop ready for a new project"></div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
