<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Talk to us | ThinkMart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/store.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: header('contact', ${cartCount})}"></div>
<main class="contact-page"><section class="contact-copy"><p class="eyebrow">Real people, helpful answers</p><h1>Let's talk<br><em>things tech.</em></h1><p>Questions about a product, an order, or what might work for you? Send us a note. We usually reply within one business day.</p><div class="contact-detail"><span>EMAIL</span><a href="mailto:hello@thinkmart.example">hello@thinkmart.example ↗</a></div></section>
    <form class="contact-form" th:action="@{/contact}" method="post"><p class="flash-message" th:if="${notice}" th:text="${notice}"></p><label for="name">Your name</label><input id="name" name="name" autocomplete="name" required maxlength="100"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="160"><label for="message">What can we help with?</label><textarea id="message" name="message" rows="5" required maxlength="2000"></textarea><button class="button button-dark" type="submit">Send your note <span>↗</span></button></form>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
