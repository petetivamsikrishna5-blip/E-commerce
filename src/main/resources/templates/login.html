<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in | ThinkMart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/store.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: header('account', ${cartCount})}"></div>
<main class="auth-page">
    <section class="auth-content">
        <p class="eyebrow">Welcome back</p><h1>Good to<br><em>see you.</em></h1>
        <p class="auth-intro">Log in to continue to ThinkMart.</p>
        <p class="flash-message" th:if="${notice}" th:text="${notice}"></p>
        <p class="flash-message error" th:if="${error}" th:text="${error}"></p>
        <form class="auth-form" th:action="@{/login}" method="post">
            <label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="160">
            <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="6" maxlength="100">
            <button class="button button-dark" type="submit">Log in <span>↗</span></button>
        </form>
        <p class="auth-switch">New to ThinkMart? <a th:href="@{/signup}">Create an account</a></p>
    </section>
    <div class="auth-visual login-visual" role="img" aria-label="A creative workspace with a laptop"></div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
